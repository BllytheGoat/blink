name = "blink"
version = "0.1.0"
edition = "2021"

[lib]
name = "blink_lib"
crate-type = ["staticlib", "cdylib"]

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.0", features = ["shell-execute", "protocol-asset"] }
tokio = { version = "1.40", features = ["full"] }
regex = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
