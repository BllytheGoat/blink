name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: 27.0.11902997

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli

      - name: Install dependencies
        run: |
          cd blink-app
          npm install

      - name: Download croc binary
        run: |
          mkdir -p blink-app/src-tauri/binaries
          wget -q https://github.com/schollz/croc/releases/download/v11.1.1/croc_v11.1.1_Linux-ARM64.tar.gz -O /tmp/croc.tar.gz
          tar -xzf /tmp/croc.tar.gz -C blink-app/src-tauri/binaries/ croc
          mv blink-app/src-tauri/binaries/croc blink-app/src-tauri/binaries/croc_aarch64-android
          chmod +x blink-app/src-tauri/binaries/croc_aarch64-android

      - name: Build APK
        run: |
          cd blink-app
          npm run tauri build -- --target aarch64-unknown-linux-android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blink-apk
          path: blink-app/src-tauri/target/aarch64-unknown-linux-android/release/bundle/apk/

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: blink-app/src-tauri/target/aarch64-unknown-linux-android/release/bundle/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
